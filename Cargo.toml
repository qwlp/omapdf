[package]
name = "omapdf"
version = "0.0.6"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A native Wayland PDF and EPUB reader built with GPUI"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11", "font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
regex = "1"
unicode-segmentation = "=1.13.3"
tempfile = "3"
sha2 = "0.10"
dirs = "6"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
fast_image_resize = "6.1"
mupdf = { version = "=0.8.0", default-features = false, features = ["epub", "html", "svg", "base14-fonts", "bundled-fonts-droid"] }
md-5 = "=0.10.6"
parking_lot = "=0.12.5"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
xattr = { path = "vendor/xattr" }

[profile.dev]
debug = 0

[profile.dev.package.fast_image_resize]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
